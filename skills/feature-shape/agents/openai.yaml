interface:
  display_name: "功能定义"
  short_description: "事实闭环后只把真正需要人的事项带到 Gate B"
  default_prompt: "使用 $feature-shape 基于项目基线和必要证据定义功能；拆分性质、责任或阻塞条件不同的未决问题，区分当前 blocker 与条件性 blocker。默认执行事实闭环循环：Agent 能在当前授权、范围和合理成本内核实的当前事实持续定向取证、回写并重新计算 blocker，不把未完成的调查作业当成用户待办。提交任何功能/架构/风险决定前先做决策就绪检查：仍有可低成本自主核实、直接影响选择且可能改变推荐的事实时，先闭环事实；只有真正需要人的价值/范围/风险取舍、明确客观限制或用户显式要求诊断复审时才停在 Gate B。人工决策先给基于项目依据的非绑定建议。"

policy:
  allow_implicit_invocation: false
